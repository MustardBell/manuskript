# This workflow is used to run pytest and produce a macOS build (Zip and DMG) as artifacts.

name: Build and Test for macOS

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  macos_build:
    name: Building for macOS 3.9 on macos-15
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install macOS dependencies
      run: |
        export HOMEBREW_NO_AUTO_UPDATE=1
        brew install enchant hunspell qt@5
        echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
        echo "PYENCHANT_LIBRARY_PATH=$(brew --prefix enchant)/lib/libenchant-2.dylib" >> "$GITHUB_ENV"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        grep -vE '^(PyQt5-Qt5|PyQt5_sip)==' requirements.txt > portable-requirements.txt
        pip install -r portable-requirements.txt
        pip install pyinstaller pyenchant pytest pytest-faulthandler pillow dmgbuild
        python -c "import enchant; print(enchant.get_enchant_version())"

    - name: Run Pytest
      run: |
        python3 -B -m pytest -vs

    - name: Build macOS App Bundle and DMG
      env:
        GIT_SHA: ${{ github.sha }}
      run: |
        GIT_SHA_SHORT="${GIT_SHA:0:7}" package/build_osx.sh

    - name: Upload Zip Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: manuskript_macos_zip
        path: ./dist/manuskript-*.zip

    - name: Upload DMG Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: manuskript_macos_dmg
        path: ./dist/manuskript-*.dmg
