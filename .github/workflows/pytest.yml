# This workflow runs pytest on every platform Manuskript ships for, so
# platform-specific behaviour — file permissions, path handling, Qt
# defaults — is caught by CI rather than by a user.

name: Pytest Run

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the develop branch
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    name: pytest ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the result on the others.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyqt5 lxml pytest pytest-faulthandler
        python -c "import os,sys; sys.exit(0)"
      shell: bash

    - name: Install project requirements
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      shell: bash

    - name: Install Linux Qt dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install build-essential qtbase5-dev qt5-qmake \
          libxml2-dev libxslt1-dev mesa-utils libgl1 libgl1-mesa-dev \
          libxcb-xinerama0-dev

    - name: Test with pytest (Linux, virtual display)
      if: runner.os == 'Linux'
      run: xvfb-run -s '-screen 0 640x480x24 +extension GLX' pytest -v

    - name: Test with pytest (Windows and macOS, offscreen Qt)
      if: runner.os != 'Linux'
      run: pytest -v
      shell: bash
      env:
        QT_QPA_PLATFORM: offscreen
