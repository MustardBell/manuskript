# This workflow runs pytest on every platform Manuskript ships for, so
# platform-specific behaviour — file permissions, path handling, Qt
# defaults — is caught by CI rather than by a user.

name: Pytest Run

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the develop branch
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    name: pytest ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing should not hide the result on the others.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyqt5 lxml pytest pytest-faulthandler
        python -c "import os,sys; sys.exit(0)"
      shell: bash

    - name: Install project requirements (Linux, exact pins)
      if: runner.os == 'Linux'
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      shell: bash

    - name: Install project requirements (Windows and macOS)
      # requirements.txt pins PyQt5-Qt5 and PyQt5_sip, whose versions are
      # decided by the platform: the pinned PyQt5-Qt5 exists only as a Linux
      # wheel, so an exact install cannot resolve here. Install the same
      # libraries and let pip pick the Qt build for this platform, which is
      # what a Windows or macOS user gets anyway.
      if: runner.os != 'Linux'
      run: |
        grep -vE '^(PyQt5-Qt5|PyQt5_sip)==' requirements.txt > portable-requirements.txt
        cat portable-requirements.txt
        pip install -r portable-requirements.txt
      shell: bash

    - name: Install Linux Qt dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install build-essential qtbase5-dev qt5-qmake \
          libxml2-dev libxslt1-dev mesa-utils libgl1 libgl1-mesa-dev \
          libxcb-xinerama0-dev

    - name: Test with pytest (Linux, virtual display)
      if: runner.os == 'Linux'
      run: xvfb-run -s '-screen 0 640x480x24 +extension GLX' python .github/ci/run_pytest_batches.py

    - name: Test with pytest (Windows and macOS, native Qt)
      if: runner.os != 'Linux'
      run: python .github/ci/run_pytest_batches.py
      shell: bash
